<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern portfolio website with a terminal preloader, hero section and more." />
    <link rel="stylesheet" href="styles.css">
    <title>Portfolio</title>
</head>
<body>
    <div id="preloader">
        <div class="terminal">Loading...</div>
    </div>
    <header id="header">
        <nav class="sticky-nav">
            <h1>My Portfolio</h1>
            <div class="theme-switcher"><button id="theme-toggle">Switch Theme</button></div>
        </nav>
    </header>
    <section id="hero">
        <div class="profile-card">
            <h2>Hello, I'm [Your Name]</h2>
            <p>Web Developer | Designer | Creator</p>
        </div>
    </section>
    <section id="gallery">
        <h2>Gallery</h2>
        <div class="auto-slider">
            <img src="image1.jpg" alt="Image 1">
            <img src="image2.jpg" alt="Image 2">
            <img src="image3.jpg" alt="Image 3">
        </div>
    </section>
    <section id="skills">
        <h2>Skills</h2>
        <div class="skill-bar"><span>HTML</span> <div class="progress" style="width:90%;"></div></div>
        <div class="skill-bar"><span>CSS</span> <div class="progress" style="width:80%;"></div></div>
        <div class="skill-bar"><span>JavaScript</span> <div class="progress" style="width:85%;"></div></div>
    </section>
    <section id="tech-stack">
        <h2>Tech Stack</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </section>
    <section id="quotes-slider">
        <h2>Islamic Quotes</h2>
        <div class="slider">
            <blockquote>Quote 1</blockquote>
            <blockquote>Quote 2</blockquote>
        </div>
    </section>
    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>
    <script src="script.js"></script>
</body>
</html>
